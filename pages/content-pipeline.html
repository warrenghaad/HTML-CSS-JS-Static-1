<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Content Pipeline - Geo-Arts Production</title>
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    .cp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .cp-header h2 { margin: 0; color: var(--accent); }
    .cp-header p { color: var(--text-muted); font-size: 0.85rem; margin: 0.25rem 0 0; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .cp-stat {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      text-align: center;
    }
    .cp-stat .big-num {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.1;
    }
    .cp-stat .stat-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 0.25rem;
    }
    .cp-stat .stat-bar-bg {
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      margin-top: 0.5rem;
    }
    .cp-stat .stat-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.5s;
    }

    .type-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .type-tab {
      padding: 0.5rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    .type-tab:hover { border-color: var(--accent); color: var(--text); }
    .type-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(125,211,252,0.1); }

    .filter-bar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .filter-bar input, .filter-bar select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 0.45rem 0.65rem;
      font-size: 0.8rem;
    }
    .filter-bar input:focus, .filter-bar select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .filter-bar input { width: 200px; }

    .add-btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      padding: 0.45rem 0.85rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .add-btn:hover { opacity: 0.85; }

    .content-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 0.75rem;
    }

    .content-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem;
      transition: border-color 0.2s;
    }
    .content-card:hover { border-color: rgba(255,255,255,0.15); }

    .content-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .content-title {
      font-weight: 600;
      font-size: 0.82rem;
      color: var(--text);
      line-height: 1.3;
      flex: 1;
    }
    .content-lesson {
      font-size: 0.65rem;
      color: var(--text-muted);
      background: rgba(255,255,255,0.06);
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      white-space: nowrap;
    }

    .content-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.5rem;
    }
    .meta-chip {
      font-size: 0.65rem;
      padding: 0.12rem 0.4rem;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .meta-chip.type-myth { color: #E91E63; border-color: rgba(233,30,99,0.3); }
    .meta-chip.type-math { color: #673AB7; border-color: rgba(103,58,183,0.3); }
    .meta-chip.type-visual_story { color: #00BCD4; border-color: rgba(0,188,212,0.3); }
    .meta-chip.type-activity { color: #FF9800; border-color: rgba(255,152,0,0.3); }

    .status-chip {
      font-size: 0.65rem;
      padding: 0.12rem 0.4rem;
      border-radius: 3px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .status-chip:hover { opacity: 0.8; }
    .status-chip.s-not_started { background: rgba(158,158,158,0.2); color: #9e9e9e; }
    .status-chip.s-drafting { background: rgba(251,192,45,0.2); color: #FBC02D; }
    .status-chip.s-review { background: rgba(33,150,243,0.2); color: #2196F3; }
    .status-chip.s-revision { background: rgba(255,152,0,0.2); color: #FF9800; }
    .status-chip.s-approved { background: rgba(76,175,80,0.2); color: #4CAF50; }

    .content-detail {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.3;
      margin-bottom: 0.4rem;
    }
    .content-detail span { margin-right: 0.75rem; }

    .content-actions {
      display: flex;
      gap: 0.35rem;
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .action-btn {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: none;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); }
    .action-btn.delete:hover { border-color: #ef5350; color: #ef5350; }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      width: 480px;
      max-width: 95vw;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-box h3 { margin: 0 0 1rem; color: var(--accent); font-size: 1rem; }
    .form-group { margin-bottom: 0.75rem; }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 0.5rem;
      font-size: 0.85rem;
      font-family: inherit;
    }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .modal-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 1rem;
    }
    .modal-actions button {
      padding: 0.5rem 1rem;
      border-radius: var(--radius);
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid var(--border);
    }
    .btn-save { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
    .btn-cancel { background: none; color: var(--text-muted); }
    .btn-save:hover { opacity: 0.85; }
    .btn-cancel:hover { color: var(--text); border-color: var(--text-muted); }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .back-link:hover { text-decoration: underline; }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .lesson-group-header {
      grid-column: 1 / -1;
      padding: 0.5rem 0;
      margin-top: 0.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .lesson-group-header .lg-num {
      background: #00BCD4;
      color: #000;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .lesson-group-header .lg-title {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text);
    }
    .lesson-group-header .lg-unit {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .content-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="logo">Geo-Arts Curriculum System</div>
    <div class="nav-links">
      <a href="../index.html">Home</a>
      <a href="production-dashboard.html">Dashboard</a>
      <a href="variables-spreadsheet.html">Variables</a>
      <a href="asset-manager.html">Assets</a>
      <a href="content-pipeline.html">Content</a>
      <a href="lesson-builder.html">Assembly</a>
      <a href="snapshot.html">QA</a>
      <a href="governance.html">Governance</a>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
  </div>

  <div class="container" style="max-width: 1400px;">
    <a href="production-dashboard.html" class="back-link">&larr; Back to Dashboard</a>

    <div class="cp-header">
      <div>
        <h2>Content Pipeline</h2>
        <p>Section 4: Track content drafts across 48 lessons &mdash; myths, math write-ups, visual stories, and activities.</p>
      </div>
    </div>

    <div class="stats-row" id="statsRow"></div>

    <div class="type-tabs" id="typeTabs">
      <button class="type-tab active" data-type="">All Content</button>
      <button class="type-tab" data-type="myth">Myths (48)</button>
      <button class="type-tab" data-type="math">Math (48)</button>
      <button class="type-tab" data-type="visual_story">Visual Stories (48)</button>
      <button class="type-tab" data-type="activity">Activities (48)</button>
    </div>

    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="Search content...">
      <select id="lessonFilter">
        <option value="">All Lessons</option>
      </select>
      <select id="statusFilter">
        <option value="">All Statuses</option>
        <option value="not_started">Not Started</option>
        <option value="drafting">Drafting</option>
        <option value="review">Review</option>
        <option value="revision">Revision</option>
        <option value="approved">Approved</option>
      </select>
      <select id="groupBy">
        <option value="lesson">Group by Lesson</option>
        <option value="type">Group by Type</option>
      </select>
      <button class="add-btn" onclick="openAddModal()">+ Add Content</button>
    </div>

    <div class="content-grid" id="contentGrid">
      <div class="empty-state">Loading content...</div>
    </div>
  </div>

  <div class="modal-overlay" id="contentModal">
    <div class="modal-box">
      <h3 id="modalTitle">Add New Content</h3>
      <input type="hidden" id="editContentId">
      <div class="form-group">
        <label>Lesson</label>
        <select id="formLesson"></select>
      </div>
      <div class="form-group">
        <label>Content Type</label>
        <select id="formType">
          <option value="myth">Myth</option>
          <option value="math">Math</option>
          <option value="visual_story">Visual Story</option>
          <option value="activity">Activity</option>
        </select>
      </div>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="formTitle" placeholder="Content title...">
      </div>
      <div class="form-group">
        <label>Body</label>
        <textarea id="formBody" placeholder="Content body..."></textarea>
      </div>
      <div class="form-group">
        <label>Assigned To</label>
        <input type="text" id="formAssigned" placeholder="e.g., Writer name">
      </div>
      <div class="form-group">
        <label>Word Count</label>
        <input type="number" id="formWordCount" placeholder="0" min="0">
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="formNotes" placeholder="Additional notes..." style="min-height:50px"></textarea>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="formStatus">
          <option value="not_started">Not Started</option>
          <option value="drafting">Drafting</option>
          <option value="review">Review</option>
          <option value="revision">Revision</option>
          <option value="approved">Approved</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-save" onclick="saveContent()">Save Content</button>
      </div>
    </div>
  </div>

  <script src="../scripts/main.js"></script>
  <script>
    let allContent = [];
    let allLessons = [];
    let currentType = '';
    let stats = null;

    const typeColors = {
      myth: '#E91E63',
      math: '#673AB7',
      visual_story: '#00BCD4',
      activity: '#FF9800',
    };
    const typeLabels = {
      myth: 'Myth',
      math: 'Math',
      visual_story: 'Visual Story',
      activity: 'Activity',
    };
    const statusLabels = {
      not_started: 'Not Started',
      drafting: 'Drafting',
      review: 'Review',
      revision: 'Revision',
      approved: 'Approved',
    };
    const statusOrder = ['not_started', 'drafting', 'review', 'revision', 'approved'];
    const nextStatus = {
      not_started: 'drafting',
      drafting: 'review',
      review: 'revision',
      revision: 'approved',
      approved: 'not_started',
    };

    function toggleTheme() {
      document.body.classList.toggle('light');
      localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
    }

    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light');
    }

    async function init() {
      const [statsRes, lessonsRes] = await Promise.all([
        fetch('/api/production/content/stats'),
        fetch('/api/production/lessons'),
      ]);
      stats = await statsRes.json();
      allLessons = await lessonsRes.json();
      renderStats();
      populateLessonDropdowns();
      await loadContent();

      document.querySelectorAll('.type-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          currentType = tab.dataset.type;
          loadContent();
        });
      });

      document.getElementById('searchInput').addEventListener('input', renderContent);
      document.getElementById('lessonFilter').addEventListener('change', loadContent);
      document.getElementById('statusFilter').addEventListener('change', loadContent);
      document.getElementById('groupBy').addEventListener('change', renderContent);
    }

    function renderStats() {
      const row = document.getElementById('statsRow');
      const overall = stats.overall;
      const overallPct = overall.total > 0 ? Math.round(overall.approved / overall.total * 100) : 0;

      const typeOrder = ['myth', 'math', 'visual_story', 'activity'];

      let html = `<div class="cp-stat">
        <div class="big-num">${overall.total}</div>
        <div class="stat-sub">Total Items</div>
        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${overallPct}%;background:var(--accent)"></div></div>
        <div class="stat-sub">${overall.approved} approved (${overallPct}%)</div>
      </div>`;

      typeOrder.forEach(t => {
        const data = stats.by_type.find(s => s.content_type === t) || { total: 0, approved: 0 };
        const pct = data.total > 0 ? Math.round(data.approved / data.total * 100) : 0;
        html += `<div class="cp-stat">
          <div class="big-num" style="color:${typeColors[t]}">${data.total}</div>
          <div class="stat-sub">${typeLabels[t]}s</div>
          <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${pct}%;background:${typeColors[t]}"></div></div>
          <div class="stat-sub">${data.approved || 0} approved (${pct}%)</div>
        </div>`;
      });
      row.innerHTML = html;
    }

    function populateLessonDropdowns() {
      const sel = document.getElementById('lessonFilter');
      const formSel = document.getElementById('formLesson');
      allLessons.forEach(l => {
        const opt1 = document.createElement('option');
        opt1.value = l.id;
        opt1.textContent = `L${l.lesson_number}: ${l.title}`;
        sel.appendChild(opt1);
        const opt2 = opt1.cloneNode(true);
        formSel.appendChild(opt2);
      });
    }

    async function loadContent() {
      const params = new URLSearchParams();
      if (currentType) params.set('type', currentType);
      const lessonId = document.getElementById('lessonFilter').value;
      if (lessonId) params.set('lesson_id', lessonId);
      const status = document.getElementById('statusFilter').value;
      if (status) params.set('status', status);

      const res = await fetch('/api/production/content?' + params.toString());
      allContent = await res.json();
      renderContent();
    }

    function renderContent() {
      const grid = document.getElementById('contentGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const groupBy = document.getElementById('groupBy').value;

      let filtered = allContent;
      if (search) {
        filtered = filtered.filter(c =>
          (c.title || '').toLowerCase().includes(search) ||
          (c.body || '').toLowerCase().includes(search) ||
          (c.assigned_to || '').toLowerCase().includes(search) ||
          (c.lesson_title || '').toLowerCase().includes(search)
        );
      }

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state">No content items match your filters.</div>';
        return;
      }

      let html = '';
      if (groupBy === 'lesson') {
        let currentLesson = -1;
        filtered.forEach(c => {
          if (c.lesson_id !== currentLesson) {
            currentLesson = c.lesson_id;
            html += `<div class="lesson-group-header">
              <span class="lg-num">${c.lesson_number}</span>
              <span class="lg-title">${esc(c.lesson_title)}</span>
            </div>`;
          }
          html += renderCard(c);
        });
      } else if (groupBy === 'type') {
        const types = ['myth', 'math', 'visual_story', 'activity'];
        types.forEach(t => {
          const items = filtered.filter(c => c.content_type === t);
          if (items.length === 0) return;
          html += `<div class="lesson-group-header">
            <span class="lg-num" style="background:${typeColors[t]}">${items.length}</span>
            <span class="lg-title">${typeLabels[t]}s</span>
          </div>`;
          items.forEach(c => { html += renderCard(c); });
        });
      } else {
        filtered.forEach(c => { html += renderCard(c); });
      }
      grid.innerHTML = html;
    }

    function renderCard(c) {
      const wordCount = c.word_count || 0;
      const assignedTo = c.assigned_to || 'Unassigned';
      return `<div class="content-card" data-id="${c.id}">
        <div class="content-card-head">
          <div class="content-title">${esc(c.title)}</div>
          <span class="content-lesson">L${c.lesson_number}</span>
        </div>
        <div class="content-meta">
          <span class="meta-chip type-${c.content_type}">${typeLabels[c.content_type] || c.content_type}</span>
          <span class="status-chip s-${c.status}" onclick="cycleStatus(${c.id}, '${c.status}')">${statusLabels[c.status] || c.status}</span>
        </div>
        <div class="content-detail">
          <span>&#128100; ${esc(assignedTo)}</span>
          <span>&#128221; ${wordCount} words</span>
        </div>
        <div class="content-actions">
          <button class="action-btn" onclick="openEditModal(${c.id})">Edit</button>
          <button class="action-btn delete" onclick="deleteContent(${c.id})">Delete</button>
        </div>
      </div>`;
    }

    function esc(str) {
      if (!str) return '';
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    async function cycleStatus(itemId, currentSt) {
      const newStatus = nextStatus[currentSt] || 'not_started';
      await fetch(`/api/production/content/${itemId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      });
      const statsRes = await fetch('/api/production/content/stats');
      stats = await statsRes.json();
      renderStats();
      await loadContent();
    }

    async function deleteContent(itemId) {
      if (!confirm('Delete this content item?')) return;
      await fetch(`/api/production/content/${itemId}`, { method: 'DELETE' });
      const statsRes = await fetch('/api/production/content/stats');
      stats = await statsRes.json();
      renderStats();
      await loadContent();
    }

    function openAddModal() {
      document.getElementById('modalTitle').textContent = 'Add New Content';
      document.getElementById('editContentId').value = '';
      document.getElementById('formTitle').value = '';
      document.getElementById('formBody').value = '';
      document.getElementById('formAssigned').value = '';
      document.getElementById('formWordCount').value = '';
      document.getElementById('formNotes').value = '';
      document.getElementById('formType').value = 'myth';
      document.getElementById('formStatus').value = 'not_started';
      const lessonFilter = document.getElementById('lessonFilter').value;
      if (lessonFilter) {
        document.getElementById('formLesson').value = lessonFilter;
      }
      document.getElementById('contentModal').classList.add('show');
    }

    function openEditModal(itemId) {
      const c = allContent.find(x => x.id === itemId);
      if (!c) return;
      document.getElementById('modalTitle').textContent = 'Edit Content';
      document.getElementById('editContentId').value = c.id;
      document.getElementById('formLesson').value = c.lesson_id;
      document.getElementById('formType').value = c.content_type;
      document.getElementById('formTitle').value = c.title || '';
      document.getElementById('formBody').value = c.body || '';
      document.getElementById('formAssigned').value = c.assigned_to || '';
      document.getElementById('formWordCount').value = c.word_count || '';
      document.getElementById('formNotes').value = c.notes || '';
      document.getElementById('formStatus').value = c.status || 'not_started';
      document.getElementById('contentModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('contentModal').classList.remove('show');
    }

    async function saveContent() {
      const editId = document.getElementById('editContentId').value;
      const body = {
        lesson_id: parseInt(document.getElementById('formLesson').value),
        content_type: document.getElementById('formType').value,
        title: document.getElementById('formTitle').value,
        body: document.getElementById('formBody').value,
        assigned_to: document.getElementById('formAssigned').value,
        word_count: parseInt(document.getElementById('formWordCount').value) || 0,
        notes: document.getElementById('formNotes').value,
        status: document.getElementById('formStatus').value,
      };

      if (editId) {
        await fetch(`/api/production/content/${editId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
      } else {
        await fetch('/api/production/content', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
      }

      closeModal();
      const statsRes = await fetch('/api/production/content/stats');
      stats = await statsRes.json();
      renderStats();
      await loadContent();
    }

    document.getElementById('contentModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    init();
  </script>
</body>
</html>

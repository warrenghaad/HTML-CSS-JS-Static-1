<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mycelial Network — Geo-Arts</title>
  <link rel="stylesheet" href="../styles/mycelial-network.css">
</head>
<body>

  <!-- ── Header ── -->
  <header class="header">
    <div>
      <h1>🍄 Mycelial Network</h1>
      <span class="subtitle">Theory · Research · Pedagogy · Design — Interactive Organization Map</span>
    </div>
    <div class="header-actions">
      <a href="../index.html" class="btn">← Back</a>
    </div>
  </header>

  <!-- ── Canvas ── -->
  <div id="network-wrap">
    <canvas id="mycelial-canvas"></canvas>
  </div>

  <!-- ── Tooltip ── -->
  <div id="node-tooltip">
    <div class="tt-title"></div>
    <div class="tt-body"></div>
    <div class="tt-tags"></div>
  </div>

  <!-- ── Side Panel ── -->
  <div id="side-panel">
    <div class="panel-header">
      <h3 id="panel-title">Node Details</h3>
      <button class="panel-close" id="panel-close" aria-label="Close panel">✕</button>
    </div>
    <div class="panel-body">
      <div id="panel-body-content"></div>
    </div>
  </div>

  <!-- ── Controls bar ── -->
  <div id="controls">
    <button data-filter="theory"   title="Filter Theory">Theory</button>
    <button data-filter="research" title="Filter Research">Research</button>
    <button data-filter="pedagogy" title="Filter Pedagogy">Pedagogy</button>
    <button data-filter="design"   title="Filter Design">Design</button>
    <div class="ctrl-sep"></div>
    <button id="btn-expand-all"   title="Expand all spores">Expand All</button>
    <button id="btn-collapse-all" title="Collapse all spores">Collapse</button>
    <div class="ctrl-sep"></div>
    <button id="btn-reset-view"   title="Reset pan &amp; zoom">Reset View</button>
  </div>

  <!-- ── Legend ── -->
  <div id="legend">
    <h4>Legend</h4>
    <div class="legend-row">
      <span class="legend-dot" style="background:#c084fc"></span>
      <span>Theory</span>
    </div>
    <div class="legend-row">
      <span class="legend-dot" style="background:#38bdf8"></span>
      <span>Research</span>
    </div>
    <div class="legend-row">
      <span class="legend-dot" style="background:#4ade80"></span>
      <span>Pedagogy</span>
    </div>
    <div class="legend-row">
      <span class="legend-dot" style="background:#fb923c"></span>
      <span>Design</span>
    </div>
    <div class="legend-row" style="margin-top:0.4rem;">
      <span class="legend-dot" style="background:#3ecf8e"></span>
      <span>Supabase</span>
    </div>
    <div class="legend-row">
      <span class="legend-dot" style="background:#a0a0a0"></span>
      <span>Notion</span>
    </div>
    <div class="legend-row" style="margin-top:0.4rem;">
      <span class="legend-dot" style="background:#4ade80;width:8px;height:8px;border-radius:50%"></span>
      <span>Active</span>
    </div>
    <div class="legend-row">
      <span class="legend-dot" style="background:#fbbf24;width:8px;height:8px;border-radius:50%"></span>
      <span>Planned</span>
    </div>
    <div class="legend-row">
      <span class="legend-dot" style="background:#7dd3fc;width:8px;height:8px;border-radius:50%"></span>
      <span>Building</span>
    </div>
  </div>

  <script src="../scripts/mycelial-network.js"></script>
</body>
</html>

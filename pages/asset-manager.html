<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asset Manager - Geo-Arts Production</title>
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    .am-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .am-header h2 { margin: 0; color: var(--accent); }
    .am-header p { color: var(--text-muted); font-size: 0.85rem; margin: 0.25rem 0 0; }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }

    .asset-stat {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      text-align: center;
    }
    .asset-stat .big-num {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.1;
    }
    .asset-stat .stat-sub {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 0.25rem;
    }
    .asset-stat .stat-bar-bg {
      height: 4px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      margin-top: 0.5rem;
    }
    .asset-stat .stat-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.5s;
    }

    .type-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .type-tab {
      padding: 0.5rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    .type-tab:hover { border-color: var(--accent); color: var(--text); }
    .type-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(212,175,55,0.1); }

    .filter-bar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .filter-bar input, .filter-bar select {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 0.45rem 0.65rem;
      font-size: 0.8rem;
    }
    .filter-bar input:focus, .filter-bar select:focus {
      outline: none;
      border-color: var(--accent);
    }
    .filter-bar input { width: 200px; }

    .add-btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      padding: 0.45rem 0.85rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .add-btn:hover { opacity: 0.85; }

    .assets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 0.75rem;
    }

    .asset-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem;
      transition: border-color 0.2s;
    }
    .asset-card:hover { border-color: rgba(255,255,255,0.15); }

    .asset-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .asset-title {
      font-weight: 600;
      font-size: 0.82rem;
      color: var(--text);
      line-height: 1.3;
      flex: 1;
    }
    .asset-lesson {
      font-size: 0.65rem;
      color: var(--text-muted);
      background: rgba(255,255,255,0.06);
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      white-space: nowrap;
    }

    .asset-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-bottom: 0.5rem;
    }
    .meta-chip {
      font-size: 0.65rem;
      padding: 0.12rem 0.4rem;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .meta-chip.type-artifact { color: #ffd54f; border-color: rgba(255,213,79,0.3); }
    .meta-chip.type-download { color: #4fc3f7; border-color: rgba(79,195,247,0.3); }
    .meta-chip.type-generated { color: #ba68c8; border-color: rgba(186,104,200,0.3); }
    .meta-chip.type-overlay { color: #81c784; border-color: rgba(129,199,132,0.3); }

    .status-chip {
      font-size: 0.65rem;
      padding: 0.12rem 0.4rem;
      border-radius: 3px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .status-chip:hover { opacity: 0.8; }
    .status-chip.s-planned { background: rgba(158,158,158,0.2); color: #9e9e9e; }
    .status-chip.s-sourced { background: rgba(79,195,247,0.2); color: #4fc3f7; }
    .status-chip.s-downloaded { background: rgba(255,183,77,0.2); color: #ffb74d; }
    .status-chip.s-ready { background: rgba(129,199,132,0.2); color: #81c784; }
    .status-chip.s-rejected { background: rgba(239,83,80,0.2); color: #ef5350; }

    .asset-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.3;
      margin-bottom: 0.4rem;
    }
    .asset-source {
      font-size: 0.68rem;
      color: var(--text-muted);
      opacity: 0.7;
    }

    .asset-actions {
      display: flex;
      gap: 0.35rem;
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .action-btn {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: none;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); }
    .action-btn.delete:hover { border-color: #ef5350; color: #ef5350; }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      width: 480px;
      max-width: 95vw;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-box h3 { margin: 0 0 1rem; color: var(--accent); font-size: 1rem; }
    .form-group { margin-bottom: 0.75rem; }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      background: rgba(0,0,0,0.2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 0.5rem;
      font-size: 0.85rem;
      font-family: inherit;
    }
    .form-group textarea { resize: vertical; min-height: 60px; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .modal-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 1rem;
    }
    .modal-actions button {
      padding: 0.5rem 1rem;
      border-radius: var(--radius);
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid var(--border);
    }
    .btn-save { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
    .btn-cancel { background: none; color: var(--text-muted); }
    .btn-save:hover { opacity: 0.85; }
    .btn-cancel:hover { color: var(--text); border-color: var(--text-muted); }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    .back-link:hover { text-decoration: underline; }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .lesson-group-header {
      grid-column: 1 / -1;
      padding: 0.5rem 0;
      margin-top: 0.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .lesson-group-header .lg-num {
      background: var(--accent);
      color: #000;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
    }
    .lesson-group-header .lg-title {
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text);
    }
    .lesson-group-header .lg-unit {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .assets-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="logo">Geo-Arts Curriculum System</div>
    <div class="nav-links">
      <a href="../index.html">Home</a>
      <a href="production-dashboard.html">Dashboard</a>
      <a href="variables-spreadsheet.html">Variables</a>
      <a href="governance.html">Governance</a>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()">Toggle Theme</button>
  </div>

  <div class="container" style="max-width: 1400px;">
    <a href="production-dashboard.html" class="back-link">&larr; Back to Dashboard</a>

    <div class="am-header">
      <div>
        <h2>Asset Manager</h2>
        <p>Section 3: Track all visual assets across 48 lessons &mdash; artifacts, downloads, AI-generated images, and geometric overlays.</p>
      </div>
    </div>

    <div class="stats-row" id="statsRow"></div>

    <div class="type-tabs" id="typeTabs">
      <button class="type-tab active" data-type="">All Assets</button>
      <button class="type-tab" data-type="artifact">Artifacts (144+)</button>
      <button class="type-tab" data-type="download">Downloads (2,400+)</button>
      <button class="type-tab" data-type="generated">AI Generated (1,500+)</button>
      <button class="type-tab" data-type="overlay">Overlays (400-600)</button>
    </div>

    <div class="filter-bar">
      <input type="text" id="searchInput" placeholder="Search assets...">
      <select id="lessonFilter">
        <option value="">All Lessons</option>
      </select>
      <select id="statusFilter">
        <option value="">All Statuses</option>
        <option value="planned">Planned</option>
        <option value="sourced">Sourced</option>
        <option value="downloaded">Downloaded</option>
        <option value="ready">Ready</option>
        <option value="rejected">Rejected</option>
      </select>
      <select id="groupBy">
        <option value="lesson">Group by Lesson</option>
        <option value="flat">Flat List</option>
      </select>
      <button class="add-btn" onclick="openAddModal()">+ Add Asset</button>
    </div>

    <div class="assets-grid" id="assetsGrid">
      <div class="empty-state">Loading assets...</div>
    </div>
  </div>

  <div class="modal-overlay" id="assetModal">
    <div class="modal-box">
      <h3 id="modalTitle">Add New Asset</h3>
      <input type="hidden" id="editAssetId">
      <div class="form-group">
        <label>Lesson</label>
        <select id="formLesson"></select>
      </div>
      <div class="form-group">
        <label>Asset Type</label>
        <select id="formType">
          <option value="artifact">Artifact</option>
          <option value="download">Download</option>
          <option value="generated">AI Generated</option>
          <option value="overlay">Overlay</option>
        </select>
      </div>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="formTitle" placeholder="Asset title...">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="formDesc" placeholder="Brief description..."></textarea>
      </div>
      <div class="form-group">
        <label>Source</label>
        <input type="text" id="formSource" placeholder="e.g., British Museum, Gemini API">
      </div>
      <div class="form-group">
        <label>Source URL</label>
        <input type="text" id="formUrl" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>License</label>
        <input type="text" id="formLicense" placeholder="e.g., Public Domain, CC BY">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="formStatus">
          <option value="planned">Planned</option>
          <option value="sourced">Sourced</option>
          <option value="downloaded">Downloaded</option>
          <option value="ready">Ready</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-save" onclick="saveAsset()">Save Asset</button>
      </div>
    </div>
  </div>

  <script src="../scripts/main.js"></script>
  <script>
    let allAssets = [];
    let allLessons = [];
    let currentType = '';
    let stats = null;

    const typeColors = {
      artifact: '#ffd54f',
      download: '#4fc3f7',
      generated: '#ba68c8',
      overlay: '#81c784',
    };
    const typeLabels = {
      artifact: 'Artifact',
      download: 'Download',
      generated: 'AI Generated',
      overlay: 'Overlay',
    };
    const statusOrder = ['planned', 'sourced', 'downloaded', 'ready', 'rejected'];
    const nextStatus = {
      planned: 'sourced',
      sourced: 'downloaded',
      downloaded: 'ready',
      ready: 'planned',
      rejected: 'planned',
    };

    async function init() {
      const [statsRes, lessonsRes] = await Promise.all([
        fetch('/api/production/assets/stats'),
        fetch('/api/production/variables'),
      ]);
      stats = await statsRes.json();
      allLessons = await lessonsRes.json();
      renderStats();
      populateLessonDropdowns();
      await loadAssets();
    }

    function renderStats() {
      const row = document.getElementById('statsRow');
      const overall = stats.overall;
      const overallPct = overall.total > 0 ? Math.round(overall.ready / overall.total * 100) : 0;

      const typeOrder = ['artifact', 'download', 'generated', 'overlay'];
      const typeTargets = { artifact: '144+', download: '2,400+', generated: '1,500+', overlay: '400-600' };

      let html = `<div class="asset-stat">
        <div class="big-num">${overall.total}</div>
        <div class="stat-sub">Total Assets</div>
        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${overallPct}%;background:var(--accent)"></div></div>
        <div class="stat-sub">${overall.ready} ready (${overallPct}%)</div>
      </div>`;

      typeOrder.forEach(t => {
        const data = stats.by_type.find(s => s.asset_type === t) || { total: 0, ready: 0 };
        const pct = data.total > 0 ? Math.round(data.ready / data.total * 100) : 0;
        html += `<div class="asset-stat">
          <div class="big-num" style="color:${typeColors[t]}">${data.total}</div>
          <div class="stat-sub">${typeLabels[t]}s (target: ${typeTargets[t]})</div>
          <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${pct}%;background:${typeColors[t]}"></div></div>
          <div class="stat-sub">${data.ready} ready (${pct}%)</div>
        </div>`;
      });
      row.innerHTML = html;
    }

    function populateLessonDropdowns() {
      const sel = document.getElementById('lessonFilter');
      const formSel = document.getElementById('formLesson');
      allLessons.forEach(l => {
        const opt1 = document.createElement('option');
        opt1.value = l.id;
        opt1.textContent = `L${l.lesson_number}: ${l.title}`;
        sel.appendChild(opt1);
        const opt2 = opt1.cloneNode(true);
        formSel.appendChild(opt2);
      });
    }

    async function loadAssets() {
      const params = new URLSearchParams();
      if (currentType) params.set('type', currentType);
      const lessonId = document.getElementById('lessonFilter').value;
      if (lessonId) params.set('lesson_id', lessonId);
      const status = document.getElementById('statusFilter').value;
      if (status) params.set('status', status);

      const res = await fetch('/api/production/assets?' + params.toString());
      allAssets = await res.json();
      renderAssets();
    }

    function renderAssets() {
      const grid = document.getElementById('assetsGrid');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const groupBy = document.getElementById('groupBy').value;

      let filtered = allAssets;
      if (search) {
        filtered = filtered.filter(a =>
          (a.title || '').toLowerCase().includes(search) ||
          (a.description || '').toLowerCase().includes(search) ||
          (a.source || '').toLowerCase().includes(search) ||
          (a.lesson_title || '').toLowerCase().includes(search)
        );
      }

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state">No assets match your filters.</div>';
        return;
      }

      let html = '';
      if (groupBy === 'lesson') {
        let currentLesson = -1;
        filtered.forEach(a => {
          if (a.lesson_id !== currentLesson) {
            currentLesson = a.lesson_id;
            html += `<div class="lesson-group-header">
              <span class="lg-num">${a.lesson_number}</span>
              <span class="lg-title">${esc(a.lesson_title)}</span>
              <span class="lg-unit">${esc(a.unit)}</span>
            </div>`;
          }
          html += renderCard(a);
        });
      } else {
        filtered.forEach(a => { html += renderCard(a); });
      }
      grid.innerHTML = html;
    }

    function renderCard(a) {
      return `<div class="asset-card" data-id="${a.id}">
        <div class="asset-card-head">
          <div class="asset-title">${esc(a.title)}</div>
          <span class="asset-lesson">L${a.lesson_number}</span>
        </div>
        <div class="asset-meta">
          <span class="meta-chip type-${a.asset_type}">${typeLabels[a.asset_type] || a.asset_type}</span>
          <span class="status-chip s-${a.status}" onclick="cycleStatus(${a.id}, '${a.status}')">${a.status}</span>
          ${a.license ? `<span class="meta-chip" style="color:var(--text-muted)">${esc(a.license)}</span>` : ''}
        </div>
        ${a.description ? `<div class="asset-desc">${esc(a.description)}</div>` : ''}
        ${a.source ? `<div class="asset-source">Source: ${esc(a.source)}</div>` : ''}
        <div class="asset-actions">
          <button class="action-btn" onclick="openEditModal(${a.id})">Edit</button>
          <button class="action-btn delete" onclick="deleteAsset(${a.id})">Delete</button>
        </div>
      </div>`;
    }

    function esc(str) {
      if (!str) return '';
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    async function cycleStatus(assetId, currentStatus) {
      const newStatus = nextStatus[currentStatus] || 'planned';
      await fetch(`/api/production/assets/${assetId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      });
      const [statsRes] = await Promise.all([fetch('/api/production/assets/stats')]);
      stats = await statsRes.json();
      renderStats();
      await loadAssets();
    }

    async function deleteAsset(assetId) {
      if (!confirm('Remove this asset?')) return;
      await fetch(`/api/production/assets/${assetId}`, { method: 'DELETE' });
      const statsRes = await fetch('/api/production/assets/stats');
      stats = await statsRes.json();
      renderStats();
      await loadAssets();
    }

    function openAddModal() {
      document.getElementById('modalTitle').textContent = 'Add New Asset';
      document.getElementById('editAssetId').value = '';
      document.getElementById('formTitle').value = '';
      document.getElementById('formDesc').value = '';
      document.getElementById('formSource').value = '';
      document.getElementById('formUrl').value = '';
      document.getElementById('formLicense').value = '';
      document.getElementById('formType').value = 'artifact';
      document.getElementById('formStatus').value = 'planned';
      const lessonFilter = document.getElementById('lessonFilter').value;
      if (lessonFilter) {
        document.getElementById('formLesson').value = lessonFilter;
      }
      document.getElementById('assetModal').classList.add('show');
    }

    function openEditModal(assetId) {
      const a = allAssets.find(x => x.id === assetId);
      if (!a) return;
      document.getElementById('modalTitle').textContent = 'Edit Asset';
      document.getElementById('editAssetId').value = a.id;
      document.getElementById('formLesson').value = a.lesson_id;
      document.getElementById('formType').value = a.asset_type;
      document.getElementById('formTitle').value = a.title || '';
      document.getElementById('formDesc').value = a.description || '';
      document.getElementById('formSource').value = a.source || '';
      document.getElementById('formUrl').value = a.source_url || '';
      document.getElementById('formLicense').value = a.license || '';
      document.getElementById('formStatus').value = a.status || 'planned';
      document.getElementById('assetModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('assetModal').classList.remove('show');
    }

    async function saveAsset() {
      const editId = document.getElementById('editAssetId').value;
      const body = {
        lesson_id: parseInt(document.getElementById('formLesson').value),
        asset_type: document.getElementById('formType').value,
        title: document.getElementById('formTitle').value,
        description: document.getElementById('formDesc').value,
        source: document.getElementById('formSource').value,
        source_url: document.getElementById('formUrl').value,
        license: document.getElementById('formLicense').value,
        status: document.getElementById('formStatus').value,
      };
      if (!body.title) { alert('Title is required'); return; }

      if (editId) {
        await fetch(`/api/production/assets/${editId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
      } else {
        await fetch('/api/production/assets', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
      }
      closeModal();
      const statsRes = await fetch('/api/production/assets/stats');
      stats = await statsRes.json();
      renderStats();
      await loadAssets();
    }

    document.querySelectorAll('.type-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.type-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentType = tab.dataset.type;
        loadAssets();
      });
    });

    document.getElementById('searchInput').addEventListener('input', renderAssets);
    document.getElementById('lessonFilter').addEventListener('change', loadAssets);
    document.getElementById('statusFilter').addEventListener('change', loadAssets);
    document.getElementById('groupBy').addEventListener('change', renderAssets);

    document.getElementById('assetModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('assetModal')) closeModal();
    });

    init();
  </script>
</body>
</html>
